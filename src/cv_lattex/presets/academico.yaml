# Perfil inicial acadêmico. Edite as seções conforme sua trajetória.
# Opções por seção: cv-lattex sections SEÇÃO
include:
  - profile
  - education
  - experience
  - publications
  - research
  - technical
  - artistic
  - supervision
  - activities
  - committees
  - awards
  - training
  - expertise
  - languages
  - events
  - other
# Os projetos e integrantes são apresentados em research.projects.
exclude: [activities.projects]
order: [profile, education, experience, publications, research, supervision]

# Omite detalhes genéricos; cada seção conserva seu contexto principal.
# Mantém a bio original; não limita anos nem quantidade de registros.
hide_fields: [details]
authors:
  name_case: original
  highlight_self: true
sections:
  education:
    show_thesis: true
    show_advisors: true
  publications.articles:
    show_authors: true
    show_links: true
    show_details: false
