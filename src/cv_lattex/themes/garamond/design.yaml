# Aparência reutilizável, aplicada com rendercv render --design.
# Referência: https://docs.rendercv.com/user_guide/yaml_input_structure/design/
# Este arquivo contém a chave design, como esperado pelo RenderCV 2.8.
design:
  theme: classic
  page:
    size: a4
    top_margin: 2.2cm
    bottom_margin: 2cm
    left_margin: 2.2cm
    right_margin: 2.2cm
    show_footer: false
    show_top_note: false
  colors:
    body: black
    name: black
    headline: black
    connections: black
    section_titles: black
    links: black
  typography:
    font_family: EB Garamond
    font_size:
      body: 11pt
      name: 15pt
      headline: 11.5pt
      connections: 10pt
      section_titles: 12pt
    bold:
      name: false
      section_titles: true
    line_spacing: 0.4em
    alignment: left
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    space_below_name: 0.2cm
    space_below_headline: 0.2cm
    space_below_connections: 0.5cm
    connections:
      show_icons: false
      separator: ' | '
      space_between_connections: 0.2cm
  section_titles:
    type: without_line
    space_above: 0.8cm
    space_below: 0.4cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.6em
    space_between_text_based_entries: 0.4em
    show_time_spans_in: []
  entries:
    side_space: 0cm
    space_between_columns: 0.4cm
    date_and_location_width: 3.6cm
    allow_page_break: true
    short_second_row: false
    summary:
      space_above: 0cm
      space_left: 0cm
  templates:
    education_entry:
      degree_column: null
      main_column: |-
        DEGREE_WITH_AREA, INSTITUTION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        DATE
        LOCATION
    experience_entry:
      main_column: |-
        POSITION, COMPANY
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        DATE
        LOCATION
    normal_entry:
      main_column: |-
        NAME
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        DATE
        LOCATION
    publication_entry:
      # Autores, referência e link são apresentados pelo template local PublicationEntry.
      main_column: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: ''
