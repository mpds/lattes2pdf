# Perfil inicial essencial. Edite as seções conforme sua trajetória.
# Opções por seção: lattes2pdf sections SEÇÃO
include:
  - profile
  - education
  - experience
  - publications.articles
  - publications.accepted
  - publications.books
  - publications.chapters
  - research.projects
  - technical
  - artistic
  - awards
  - languages
# Remova estas exclusões se eventos e mídia forem centrais à sua atuação.
exclude: [technical.events, technical.broadcasts, technical.web]
order: [profile, experience, education, publications, research, technical, artistic]

# Mantém a bio original; omite detalhes genéricos e informações da tese.
# Todos os registros das seções incluídas são mantidos.
hide_fields: [details]
authors:
  name_case: original
  highlight_self: true
sections:
  education:
    show_thesis: false
    show_advisors: false
  publications.articles:
    show_authors: true
    show_links: true
    show_details: false
