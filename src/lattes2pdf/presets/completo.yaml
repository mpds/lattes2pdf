# Seleção de conteúdo do modelo Completo da exportação Lattes.
# Edite as categorias: lattes2pdf sections
# Cada registro aparece uma vez, mesmo quando pertence a várias categorias.
include:
  - profile
  - lattes.endereco  # Endereço
  - lattes.formacao  # Formação acadêmica/titulação
  - lattes.atuacao  # Atuação profissional
  - lattes.licencas  # Licenças
  - lattes.areas  # Áreas de atuação
  - lattes.projetos  # Projetos
  - lattes.premios  # Prêmios e títulos
  - lattes.artigos  # Artigos completos publicados
  - lattes.artigos-aceitos  # Artigos aceitos para publicação
  - lattes.livros-capitulos  # Livros e capítulos
  - lattes.anais  # Trabalhos publicados em anais de eventos
  - lattes.apresentacoes  # Apresentação de trabalho e palestra
  - lattes.jornais-revistas  # Texto em jornal ou revista
  - lattes.outras-bibliograficas  # Outras produções bibliográficas
  - lattes.patentes  # Patentes e registros
  - lattes.inovacao  # Inovação
  - lattes.software  # Programa de computador sem registro
  - lattes.produtos  # Produtos
  - lattes.processos  # Processos
  - lattes.assessoria-consultoria  # Assessoria e consultoria
  - lattes.extensao-tecnologica  # Extensão tecnológica
  - lattes.trabalhos-tecnicos  # Trabalhos técnicos
  - lattes.outras-tecnicas  # Outras produções técnicas
  - lattes.artistica  # Produção artística/cultural
  - lattes.orientacoes  # Orientações e supervisões
  - lattes.eventos  # Eventos
  - lattes.bancas  # Bancas
  - lattes.popularizacao  # Educação e Popularização de C&T
  - lattes.midia  # Entrevistas, mesas redondas, programas e comentários na mídia
  - lattes.web  # Redes sociais, websites, blogs
  - lattes.idiomas  # Idiomas
  - lattes.demais-trabalhos  # Demais trabalhos
  - lattes.outras-informacoes  # Outras informações relevantes

# A bio é opcional; remova summary para incluí-la.
# Os controles de apresentação são independentes do modelo de seleção.
hide_fields: [details, summary]
authors:
  name_case: original
  highlight_self: true
  et_al: false  # Utilizar abreviação et al.
  use_informed_citation: true  # Utilizar Citação Bibliográfica Informada
sections:
  profile:
    show_birth_date: false
    show_birth_place: false
  education:
    show_thesis: true
    show_advisors: true
    show_scholarship: true
  awards:
    show_institution: true
  research.projects:
    show_description: true
  lattes.patentes:
    show_registration_institution: true
    show_registration_number: true
    show_deposit_date: true
    show_grant_date: true
  events:
    show_event_type: false
  publications.articles:
    show_authors: true
    show_links: true
    show_details: false

# Todo o período; para limitar, use por exemplo {since: 2020}.
periods:
  professional: {}
  production: {}

# Independente do tema: abnt ou chicago (autor-data).
bibliography_style: abnt
