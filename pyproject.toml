[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cv-lattex"
version = "0.1.0"
description = "Seleção e conversão de currículos Lattes para RenderCV"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "defusedxml>=0.7.1,<1",
    "PyYAML>=6.0.2,<7",
    "rendercv[full]>=2.8,<2.9",
]

[project.scripts]
cv-lattex = "cv_lattex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_lattex"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/LICENSE", "/README.md", "/CONTRIBUTING.md"]

[dependency-groups]
dev = ["ruff>=0.15,<0.17", "pytest>=8,<10", "build>=1.2,<2", "pypdf>=6,<7"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
